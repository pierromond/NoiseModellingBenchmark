name: Benchmark & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      nm_version:
        description: 'Forcer une version NM (ex: 5.0.2). Vide = auto-detection depuis pom.xml.'
        required: false
        type: string
  schedule:
    - cron: '0 4 15 * *'

permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix11: ${{ steps.list.outputs.matrix11 }}
      matrix25: ${{ steps.list.outputs.matrix25 }}
    steps:
      - name: Checkout Benchmark repo
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build version matrices from versions.json
        id: list
        run: |
          python3 -c "import json;d=json.load(open('versions.json'));rel=[v for v in sorted(d) if d[v]];print('matrix11=' + json.dumps([v for v in rel if not v.startswith('v6')]));print('matrix25=' + json.dumps([v for v in rel if v.startswith('v6')]))" >> "$GITHUB_OUTPUT"
          python3 -c "import json;d=json.load(open('versions.json'));print('java11 :', sorted(v for v,url in d.items() if url and not v.startswith('v6')));print('java25 :', sorted(v for v,url in d.items() if url and v.startswith('v6')));print('head (artifact, java25) :', sorted(v for v,url in d.items() if not url))"

  check-new-version:
    runs-on: ubuntu-latest
    outputs:
      new_version:  ${{ steps.detect.outputs.new_version }}
      has_new:      ${{ steps.detect.outputs.has_new }}
      target_version: ${{ steps.target.outputs.target_version }}
      has_target:     ${{ steps.target.outputs.has_target }}
      artifact_url: ${{ steps.artifact.outputs.artifact_url }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}

    steps:
      - name: Checkout Benchmark repo
        uses: actions/checkout@v4
        with:
          lfs: false
          

      - name: Detect new NM version from pom.xml
        id: detect
        env:
          NM_VERSION_INPUT: ${{ inputs.nm_version }}
        run: |
          if [ -n "$NM_VERSION_INPUT" ]; then
            echo "new_version=$NM_VERSION_INPUT" >> $GITHUB_OUTPUT
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "Version forcée : v$NM_VERSION_INPUT"
            exit 0
          fi

          # Sur un push direct → pas de détection automatique
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
          fi

          POM=$(curl -sS -f \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/Universite-Gustave-Eiffel/NoiseModelling/contents/pom.xml?ref=main" || true)

          if [ -z "$POM" ]; then
            echo "Impossible de récupérer pom.xml"
            echo "has_new=false" >> $GITHUB_OUTPUT
            exit 0
          fi


          LATEST=$(echo "$POM" | grep -m1 '<version>' | \
            sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d '[:space:]')

          echo "LATEST=[$LATEST]"


          if python3 -c "import json,sys;sys.exit(0 if sys.argv[1] in json.load(open('versions.json')) else 1)" "v$LATEST"; then
            echo "v${LATEST} déjà dans le benchmark."
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            echo "Nouvelle version : v${LATEST}"
            echo "new_version=$LATEST" >> $GITHUB_OUTPUT
            echo "has_new=true" >> $GITHUB_OUTPUT
          fi
        

      - name: Resolve target version
        id: target
        run: |
          NEW_VERSION="${{ steps.detect.outputs.new_version }}"
          HAS_NEW="${{ steps.detect.outputs.has_new }}"
          if [ "$HAS_NEW" = "true" ] && [ -n "$NEW_VERSION" ]; then
            TARGET="$NEW_VERSION"
          else
            TARGET=$(python3 -c "import json;d=json.load(open('versions.json'));h=sorted(v for v,url in d.items() if not url);print(h[-1][1:] if h else '')")
          fi
          if [ -n "$TARGET" ]; then
            echo "target_version=$TARGET" >> "$GITHUB_OUTPUT"
            echo "has_target=true" >> "$GITHUB_OUTPUT"
            echo "Version cible : v$TARGET"
          else
            echo "target_version=" >> "$GITHUB_OUTPUT"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            echo "Aucune version cible : aucune entree sans URL dans versions.json."
          fi

      - name: Find artifact from latest run if successful
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        if: steps.target.outputs.has_target == 'true'
        run: |
          NM_VERSION="${{ steps.target.outputs.target_version }}"
          REPO="Universite-Gustave-Eiffel/NoiseModelling"
          CI_WORKFLOW_PATH=".github/workflows/CI.yml"

          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT absent : récupération d'artifact ignorée."
            echo "artifact_url=" >> $GITHUB_OUTPUT
            echo "artifact_name=" >> $GITHUB_OUTPUT
            echo "artifact_sha=" >> $GITHUB_OUTPUT
            exit 0
          fi

          CI_WORKFLOW_ID=$(curl -sS -f \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows" | python3 -c "
          import sys, json
          for w in json.load(sys.stdin).get('workflows', []):
              if w.get('path') == '${CI_WORKFLOW_PATH}':
                  print(w['id']); break
          " || true)

          if [ -z "$CI_WORKFLOW_ID" ]; then
            echo "Workflow ${CI_WORKFLOW_PATH} introuvable dans ${REPO} — artifact ignoré."
            echo "artifact_url=" >> $GITHUB_OUTPUT
            echo "artifact_name=" >> $GITHUB_OUTPUT
            echo "artifact_sha=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Workflow CI : ${CI_WORKFLOW_PATH} (id=${CI_WORKFLOW_ID})"
          
              
          LAST_RUN=$(curl -sS -f \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${REPO}/actions/workflows/${CI_WORKFLOW_ID}/runs?branch=main&status=success&per_page=1" || true)
          

          RUN_INFO=$(echo "$LAST_RUN" | python3 -c "
          import sys, json
          try:
              runs = json.load(sys.stdin).get('workflow_runs', [])
          except Exception:
              runs = []
          if not runs:
              print('NONE'); sys.exit(0)
          r = runs[0]
          print(r['id'])
          print(r['conclusion'] or 'in_progress')
          print(r['head_sha'])
          ")

          RUN_ID=$(echo "$RUN_INFO" | sed -n '1p')
          CONCLUSION=$(echo "$RUN_INFO" | sed -n '2p')
          RUN_SHA=$(echo "$RUN_INFO" | sed -n '3p')

          echo "Dernier run : id=$RUN_ID | conclusion=$CONCLUSION"

          # Si le dernier run n'est pas réussi → skip
          if [ "$RUN_ID" = "NONE" ] || [ "$CONCLUSION" != "success" ]; then
            echo "Dernier run non réussi (conclusion=$CONCLUSION) — artifact ignoré."
            echo "artifact_url=" >> $GITHUB_OUTPUT
            echo "artifact_name=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Run réussi — récupération de l'artifact..."

          ARTIFACTS=$(curl -sS -f \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Universite-Gustave-Eiffel/NoiseModelling/actions/runs/${RUN_ID}/artifacts" || true)

          ARTIFACT_INFO=$(echo "$ARTIFACTS" | python3 -c "
          import sys, json
          try:
              arts = json.load(sys.stdin)
          except Exception:
              arts = {}
          for a in arts.get('artifacts', []):
              name = a['name']
              if name.startswith('NoiseModelling-'):
                print(a['id'])
                print(a['name'])
                print(a['archive_download_url'])
                break
          ")

          ARTIFACT_ID=$(echo "$ARTIFACT_INFO" | sed -n '1p')
          ARTIFACT_NAME=$(echo "$ARTIFACT_INFO" | sed -n '2p')
          ARTIFACT_URL=$(echo "$ARTIFACT_INFO" | sed -n '3p')

          if [ -z "$ARTIFACT_URL" ]; then
            echo "Aucun artifact NM trouvé."
            echo "artifact_url=" >> $GITHUB_OUTPUT
            echo "artifact_name=" >> $GITHUB_OUTPUT
            echo "artifact_sha=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Artifact : $ARTIFACT_NAME (id=$ARTIFACT_ID, run sha=$RUN_SHA)"
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "artifact_sha=$RUN_SHA" >> $GITHUB_OUTPUT

      - name: Check artifact matches requested version
        if: steps.detect.outputs.has_new == 'true' && steps.detect.outputs.new_version != '' && steps.artifact.outputs.artifact_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          POM=$(curl -sS -f \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/Universite-Gustave-Eiffel/NoiseModelling/contents/pom.xml?ref=${{ steps.artifact.outputs.artifact_sha }}" || true)

          if [ -z "$POM" ]; then
            echo "::warning::pom.xml illisible au sha de l'artifact — vérification ignorée."
            exit 0
          fi

          FOUND=$(echo "$POM" | grep -m1 '<version>' | \
            sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d '[:space:]')

          if [ "$FOUND" != "${{ steps.target.outputs.target_version }}" ]; then
            echo "::error::artifact du CI NoiseModelling = v${FOUND}, version demandée = v${{ steps.target.outputs.target_version }} — résultats non publiés."
            exit 1
          fi

          echo "Artifact cohérent avec la version demandée : v${FOUND}"

      - name: Download and prepare NM artifact
        if: steps.target.outputs.has_target == 'true' && steps.artifact.outputs.artifact_url != ''
        run: |
          NM_VERSION="${{ steps.target.outputs.target_version }}"
          ARTIFACT_URL="${{ steps.artifact.outputs.artifact_url }}"

          mkdir -p input

          echo "Téléchargement de l'artifact..."
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "$ARTIFACT_URL" \
            -o "input/NoiseModelling_v${NM_VERSION}_artifact.zip"

          ls -lh input/
          mkdir -p input/NoiseModelling_without_gui_v${NM_VERSION}
          unzip -q "input/NoiseModelling_v${NM_VERSION}_artifact.zip" \
            -d "input/NoiseModelling_without_gui_v${NM_VERSION}" || true
            
          echo "Structure extraite :"
          ls "input/NoiseModelling_without_gui_v${NM_VERSION}/"
          
      - name: Upload extracted NM binary as artifact
        if: steps.target.outputs.has_target == 'true' && steps.artifact.outputs.artifact_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: nm-binary-${{ steps.target.outputs.target_version }}
          path: input/NoiseModelling_without_gui_v${{ steps.target.outputs.target_version }}/
          retention-days: 1


      - name: Update versions.json via GitHub API
        if: steps.detect.outputs.has_new == 'true' && steps.detect.outputs.new_version != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NM_VERSION: ${{ steps.detect.outputs.new_version }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - "$NM_VERSION" << 'PYEOF'
          import json, sys
          key = f"v{sys.argv[1]}"
          path = "versions.json"
          with open(path) as f:
              versions = json.load(f)
          if key in versions and versions[key] == "":
              print(f"{key} déjà présent")
              sys.exit(0)
          versions[key] = ""
          for old in sorted(k for k, v in versions.items() if not v and k != key):
              del versions[old]
              print(f"{old} retirée (une seule version head conservée)")
          with open(path, "w") as f:
              json.dump(versions, f, indent=2, sort_keys=True)
              f.write("\n")
          print(f"{key} ajoutée dans versions.json (URL à compléter)")
          PYEOF

          FILE_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${REPO}/contents/versions.json?ref=${BRANCH}" | jq -r '.sha')

          CONTENT_BASE64=$(base64 -w 0 versions.json | tr -d '\n')

          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/contents/versions.json" \
            -d "{
              \"message\": \"chore: add NoiseModelling v${NM_VERSION} to benchmark matrix [skip ci]\",
              \"content\": \"${CONTENT_BASE64}\",
              \"sha\": \"${FILE_SHA}\",
              \"branch\": \"${BRANCH}\"
            }"
          
  benchmark_new_version:
      needs: check-new-version
      if: |
        needs.check-new-version.outputs.has_target == 'true' &&
        needs.check-new-version.outputs.artifact_url != ''
      runs-on: ubuntu-latest
      timeout-minutes: 480
      env:
        JAVA_TAG: java25
      steps:
  
        - name: Checkout repo
          uses: actions/checkout@v4
          with:
            lfs: false

        - name: Compute input cache key
          id: clisson_key
          run: echo "key=clisson-${{ hashFiles('input/clisson/**') }}" >> "$GITHUB_OUTPUT"

        - name: Restore Clisson input data
          id: clisson
          uses: actions/cache/restore@v4
          with:
            path: input/clisson
            key: ${{ steps.clisson_key.outputs.key }}

        - name: Fetch Clisson LFS data
          id: clisson_fetch
          if: steps.clisson.outputs.cache-hit != 'true'
          run: |
            git config --local --unset-all lfs.fetchexclude || true
            git lfs pull --include="input/clisson/**"
            test "$(stat -c%s input/clisson/clisson/DEM.geojson)" -gt 100000

        - name: Save Clisson input data
          if: steps.clisson.outputs.cache-hit != 'true' && steps.clisson_fetch.outcome == 'success'
          continue-on-error: true
          uses: actions/cache/save@v4
          with:
            path: input/clisson
            key: ${{ steps.clisson_key.outputs.key }}

        - name: Set up Java 25
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '25'
        - name: Check Java
          run: java -version

        - name: Check disk space
          run: df -h

        - name: Restore result for target version
          id: result
          uses: actions/cache/restore@v4
          with:
            path: output/v${{ needs.check-new-version.outputs.target_version }}
            key: result-${{ env.JAVA_TAG }}-v${{ needs.check-new-version.outputs.target_version }}-${{ needs.check-new-version.outputs.artifact_name }}-${{ hashFiles('benchmark_run.sh', 'versions.json', 'nm_version/src/main/groovy/**', 'input/clisson/**') }}

        - name: Restore NM binary for target version
          if: steps.result.outputs.cache-hit != 'true'
          uses: actions/download-artifact@v4
          with:
            name: nm-binary-${{ needs.check-new-version.outputs.target_version }}
            path: input/NoiseModelling_without_gui_v${{ needs.check-new-version.outputs.target_version }}
          continue-on-error: true

        - name: Run benchmark for target version
          id: run
          if: steps.result.outputs.cache-hit != 'true'
          continue-on-error: true
          run: bash -x benchmark_run.sh --version v${{ needs.check-new-version.outputs.target_version }}

        - name: Save result in cache for target version
          if: steps.result.outputs.cache-hit != 'true' && steps.run.outcome == 'success'
          continue-on-error: true
          uses: actions/cache/save@v4
          with:
            path: output/v${{ needs.check-new-version.outputs.target_version }}
            key: result-${{ env.JAVA_TAG }}-v${{ needs.check-new-version.outputs.target_version }}-${{ needs.check-new-version.outputs.artifact_name }}-${{ hashFiles('benchmark_run.sh', 'versions.json', 'nm_version/src/main/groovy/**', 'input/clisson/**') }}

        - name: Show simulation log for target version ${{ needs.check-new-version.outputs.target_version }}
          if: always()
          run: |
            find output -name simulation.log -exec sh -c 'echo ==== $1 ====; tail -100 "$1"' _ {} \;
            
        - name: Upload output for ${{ needs.check-new-version.outputs.target_version }}
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: output-v${{ needs.check-new-version.outputs.target_version }}
            path: output/v${{ needs.check-new-version.outputs.target_version }}
            if-no-files-found: ignore
            retention-days: 1
            
  benchmark:
      needs: versions
      runs-on: ubuntu-latest
      timeout-minutes: 300
      env:
        JAVA_TAG: java11
      strategy:
        fail-fast: false
        matrix:
          version: ${{ fromJSON(needs.versions.outputs.matrix11) }}
      steps:
        - name: Free disk space
          uses: jlumbroso/free-disk-space@v1.3.1
          with:
            tool-cache: true
            android: true
            dotnet: true
            haskell: true
            large-packages: true
            docker-images: true
            swap-storage: true
  
        - name: Checkout repo
          uses: actions/checkout@v4
          with:
            lfs: false

        - name: Compute input cache key
          id: clisson_key
          run: echo "key=clisson-${{ hashFiles('input/clisson/**') }}" >> "$GITHUB_OUTPUT"

        - name: Restore Clisson input data
          id: clisson
          uses: actions/cache/restore@v4
          with:
            path: input/clisson
            key: ${{ steps.clisson_key.outputs.key }}

        - name: Fetch Clisson LFS data
          id: clisson_fetch
          if: steps.clisson.outputs.cache-hit != 'true'
          run: |
            git config --local --unset-all lfs.fetchexclude || true
            git lfs pull --include="input/clisson/**"
            test "$(stat -c%s input/clisson/clisson/DEM.geojson)" -gt 100000

        - name: Save Clisson input data
          if: steps.clisson.outputs.cache-hit != 'true' && steps.clisson_fetch.outcome == 'success'
          continue-on-error: true
          uses: actions/cache/save@v4
          with:
            path: input/clisson
            key: ${{ steps.clisson_key.outputs.key }}

        - name: Set up Java 11
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '11'
  
        - name: Check disk space
          run: df -h
  
        - name: Cache NM binary for ${{ matrix.version }}
          uses: actions/cache@v4
          with:
            path: input/NoiseModelling_without_gui_${{ matrix.version }}/
            key: nm-binary-${{ matrix.version }}-${{ hashFiles('versions.json') }}

        - name: Restore result for ${{ matrix.version }}
          id: result
          uses: actions/cache/restore@v4
          with:
            path: output/${{ matrix.version }}
            key: result-${{ env.JAVA_TAG }}-${{ matrix.version }}-${{ hashFiles('benchmark_run.sh', 'versions.json', 'nm_version/src/main/groovy/**', 'input/clisson/**') }}
  
        - name: Run benchmark for ${{ matrix.version }}
          id: run
          if: steps.result.outputs.cache-hit != 'true'
          continue-on-error: true
          run: bash -x benchmark_run.sh --version ${{ matrix.version }}

        - name: Save result in cache for ${{ matrix.version }}
          if: steps.result.outputs.cache-hit != 'true' && steps.run.outcome == 'success'
          continue-on-error: true
          uses: actions/cache/save@v4
          with:
            path: output/${{ matrix.version }}
            key: result-${{ env.JAVA_TAG }}-${{ matrix.version }}-${{ hashFiles('benchmark_run.sh', 'versions.json', 'nm_version/src/main/groovy/**', 'input/clisson/**') }}
  
        - name: Check disk space after run
          if: always()
          run: df -h && du -sh input/ output/ 2>/dev/null | sort -rh
  
        - name: Show simulation log
          if: always()
          run: |
            find output -name simulation.log -exec sh -c 'echo ==== $1 ====; tail -100 "$1"' _ {} \;
  
        - name: Upload output for ${{ matrix.version }}
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: output-${{ matrix.version }}
            path: output/${{ matrix.version }}/
            if-no-files-found: ignore
            retention-days: 1
      


  benchmark_java25:
      needs: versions
      runs-on: ubuntu-latest
      timeout-minutes: 300
      env:
        JAVA_TAG: java25
      strategy:
        fail-fast: false
        matrix:
          version: ${{ fromJSON(needs.versions.outputs.matrix25) }}
      steps:
        - name: Free disk space
          uses: jlumbroso/free-disk-space@v1.3.1
          with:
            tool-cache: true
            android: true
            dotnet: true
            haskell: true
            large-packages: true
            docker-images: true
            swap-storage: true

        - name: Checkout repo
          uses: actions/checkout@v4
          with:
            lfs: false

        - name: Compute input cache key
          id: clisson_key
          run: echo "key=clisson-${{ hashFiles('input/clisson/**') }}" >> "$GITHUB_OUTPUT"

        - name: Restore Clisson input data
          id: clisson
          uses: actions/cache/restore@v4
          with:
            path: input/clisson
            key: ${{ steps.clisson_key.outputs.key }}

        - name: Fetch Clisson LFS data
          id: clisson_fetch
          if: steps.clisson.outputs.cache-hit != 'true'
          run: |
            git config --local --unset-all lfs.fetchexclude || true
            git lfs pull --include="input/clisson/**"
            test "$(stat -c%s input/clisson/clisson/DEM.geojson)" -gt 100000

        - name: Save Clisson input data
          if: steps.clisson.outputs.cache-hit != 'true' && steps.clisson_fetch.outcome == 'success'
          continue-on-error: true
          uses: actions/cache/save@v4
          with:
            path: input/clisson
            key: ${{ steps.clisson_key.outputs.key }}

        - name: Set up Java 25
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '25'

        - name: Check disk space
          run: df -h

        - name: Cache NM binary for ${{ matrix.version }}
          uses: actions/cache@v4
          with:
            path: input/NoiseModelling_without_gui_${{ matrix.version }}/
            key: nm-binary-${{ matrix.version }}-${{ hashFiles('versions.json') }}

        - name: Restore result for ${{ matrix.version }}
          id: result
          uses: actions/cache/restore@v4
          with:
            path: output/${{ matrix.version }}
            key: result-${{ env.JAVA_TAG }}-${{ matrix.version }}-${{ hashFiles('benchmark_run.sh', 'versions.json', 'nm_version/src/main/groovy/**', 'input/clisson/**') }}

        - name: Run benchmark for ${{ matrix.version }}
          id: run
          if: steps.result.outputs.cache-hit != 'true'
          continue-on-error: true
          run: bash -x benchmark_run.sh --version ${{ matrix.version }}

        - name: Save result in cache for ${{ matrix.version }}
          if: steps.result.outputs.cache-hit != 'true' && steps.run.outcome == 'success'
          continue-on-error: true
          uses: actions/cache/save@v4
          with:
            path: output/${{ matrix.version }}
            key: result-${{ env.JAVA_TAG }}-${{ matrix.version }}-${{ hashFiles('benchmark_run.sh', 'versions.json', 'nm_version/src/main/groovy/**', 'input/clisson/**') }}

        - name: Check disk space after run
          if: always()
          run: df -h && du -sh input/ output/ 2>/dev/null | sort -rh

        - name: Show simulation log
          if: always()
          run: |
            find output -name simulation.log -exec sh -c 'echo ==== $1 ====; tail -100 "$1"' _ {} \;

        - name: Upload output for ${{ matrix.version }}
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: output-${{ matrix.version }}
            path: output/${{ matrix.version }}/
            if-no-files-found: ignore
            retention-days: 1

  build-website:
    needs: [benchmark, benchmark_java25, benchmark_new_version]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compute input cache key
        id: clisson_key
        run: echo "key=clisson-${{ hashFiles('input/clisson/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore Clisson input data
        id: clisson
        uses: actions/cache/restore@v4
        with:
          path: input/clisson
          key: ${{ steps.clisson_key.outputs.key }}

      - name: Fetch Clisson LFS data
        id: clisson_fetch
        if: steps.clisson.outputs.cache-hit != 'true'
        run: |
          git config --local --unset-all lfs.fetchexclude || true
          git lfs pull --include="input/clisson/**"
          test "$(stat -c%s input/clisson/clisson/DEM.geojson)" -gt 100000

      - name: Save Clisson input data
        if: steps.clisson.outputs.cache-hit != 'true' && steps.clisson_fetch.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: input/clisson
          key: ${{ steps.clisson_key.outputs.key }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all outputs
        uses: actions/download-artifact@v4
        with:
          pattern: output-*
          path: output/
          merge-multiple: false

      - name: Fix artifact folder names
        run: |
          for d in output/output-*; do
            [ -d "$d" ] || continue
            v=$(basename "$d" | sed 's/^output-//')
            mv "$d" "output/$v"
          done
          ls -la output/

      - name: Generate website
        run: bash benchmark_run.sh --aggregate-only

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Drop template from published site
        run: rm -f website/template.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/

  deploy:
    needs: build-website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
